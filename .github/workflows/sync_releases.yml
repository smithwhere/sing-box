name: Pure API Sync Releases

on:
  schedule:
    - cron: '0 0,12 * * *' # 每 12 小时自动检查
  workflow_dispatch:      # 支持随时手动点击运行

jobs:
  api-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync via GitHub API
        id: sync
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SYNC_TOKEN }}
          script: |
            const upstreamOwner = "SagerNet";
            const upstreamRepo = "sing-box";
            const myOwner = context.repo.owner;
            const myRepo = context.repo.repo;
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

            // GitHub asset endpoints can return transient 5xx responses, including
            // malformed/empty JSON bodies. Retry those and rate-limit responses.
            async function withRetry(label, operation, attempts = 6) {
              for (let attempt = 1; ; attempt++) {
                try {
                  return await operation();
                } catch (error) {
                  const status = error.status || error.response?.status;
                  const retryable = status === 429 || [500, 502, 503, 504].includes(status);
                  if (!retryable || attempt >= attempts) {
                    throw new Error(`${label} failed after ${attempt} attempt(s): ${error.message}`);
                  }
                  const retryAfter = Number(error.response?.headers?.["retry-after"] || 0) * 1000;
                  const delay = Math.max(retryAfter, Math.min(60000, 2000 * (2 ** (attempt - 1))));
                  console.log(`[重试 ${attempt}/${attempts - 1}] ${label}: HTTP ${status || "unknown"}，等待 ${Math.ceil(delay / 1000)} 秒`);
                  await sleep(delay);
                }
              }
            }

            console.log("正在通过 GitHub API 获取原仓库的最新 Releases...");
            const upstreamReleases = await github.rest.repos.listReleases({
              owner: upstreamOwner,
              repo: upstreamRepo,
              per_page: 3
            });

            console.log("正在获取你自己的仓库已有的 Releases...");
            const myReleases = await github.rest.repos.listReleases({
              owner: myOwner,
              repo: myRepo,
              per_page: 100
            });
            const myReleaseByTag = new Map(myReleases.data.map(release => [release.tag_name, release]));
            const syncedTags = [];

            // Older versions first. Continue partially-created releases instead of
            // treating the presence of a tag as proof that every asset was copied.
            for (const release of upstreamReleases.data.reverse()) {
              let targetRelease = myReleaseByTag.get(release.tag_name);
              if (!targetRelease) {
                console.log(`[开始搬运] 创建版本 ${release.tag_name}...`);
                const created = await withRetry(`创建 Release ${release.tag_name}`, () =>
                  github.rest.repos.createRelease({
                    owner: myOwner,
                    repo: myRepo,
                    tag_name: release.tag_name,
                    name: release.name || release.tag_name,
                    body: release.body || "自动同步自上游仓库更新日志。",
                    draft: false,
                    prerelease: release.prerelease
                  })
                );
                targetRelease = created.data;
                myReleaseByTag.set(release.tag_name, targetRelease);
              } else {
                console.log(`[续传] 继续检查版本 ${release.tag_name} 的附件...`);
              }

              const existingAssets = await github.paginate(
                github.rest.repos.listReleaseAssets,
                { owner: myOwner, repo: myRepo, release_id: targetRelease.id, per_page: 100 }
              );
              const existingNames = new Set(existingAssets.map(asset => asset.name));
              let complete = true;

              for (const asset of release.assets) {
                if (existingNames.has(asset.name)) {
                  console.log(`[跳过] ${asset.name} 已存在。`);
                  continue;
                }

                console.log(`[下载] ${asset.name}`);
                const assetData = await withRetry(`下载 ${asset.name}`, () =>
                  github.rest.repos.getReleaseAsset({
                    owner: upstreamOwner,
                    repo: upstreamRepo,
                    asset_id: asset.id,
                    headers: { accept: "application/octet-stream" }
                  })
                );
                const fileBuffer = Buffer.from(assetData.data);

                try {
                  await withRetry(`上传 ${asset.name}`, () =>
                    github.rest.repos.uploadReleaseAsset({
                      owner: myOwner,
                      repo: myRepo,
                      release_id: targetRelease.id,
                      name: asset.name,
                      data: fileBuffer,
                      headers: {
                        "content-type": asset.content_type || "application/octet-stream",
                        "content-length": fileBuffer.length
                      }
                    })
                  );
                } catch (error) {
                  // A timed-out upload may have reached GitHub. Confirm before
                  // failing so a later run can safely resume without duplicates.
                  const refreshed = await github.paginate(
                    github.rest.repos.listReleaseAssets,
                    { owner: myOwner, repo: myRepo, release_id: targetRelease.id, per_page: 100 }
                  );
                  if (!refreshed.some(item => item.name === asset.name)) throw error;
                }

                existingNames.add(asset.name);
                console.log(`[完成] ${asset.name}`);
              }

              // Confirm completeness against GitHub's current asset listing.
              const finalAssets = await github.paginate(
                github.rest.repos.listReleaseAssets,
                { owner: myOwner, repo: myRepo, release_id: targetRelease.id, per_page: 100 }
              );
              const finalNames = new Set(finalAssets.map(asset => asset.name));
              const missing = release.assets.filter(asset => !finalNames.has(asset.name)).map(asset => asset.name);
              if (missing.length) {
                complete = false;
                throw new Error(`版本 ${release.tag_name} 尚有 ${missing.length} 个附件未同步：${missing.slice(0, 10).join(", ")}`);
              }

              if (complete) {
                console.log(`[完成] ${release.tag_name} 的 ${release.assets.length} 个附件均已同步。`);
                syncedTags.push(release.tag_name);
              }
            }

            core.setOutput("synced", String(syncedTags.length > 0));
            core.setOutput("summary", syncedTags.join(", "));

      - name: Send sync notification email
        if: steps.sync.outputs.synced == 'true'
        uses: dawidd6/action-send-mail@v9
        with:
          server_address: smtp.qq.com
          server_port: 465
          secure: true
          username: 317718961@qq.com
          password: ${{ secrets.QQ_SMTP_AUTH_CODE }}
          subject: ${{ github.event.repository.name }} Releases 同步完成
          to: any@phone.eu.org
          from: 317718961@qq.com
          body: |
            ${{ github.event.repository.name }} Releases 同步已完成。
            本次同步版本：${{ steps.sync.outputs.summary }}
